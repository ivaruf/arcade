<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  The gopher cloud arcade used to live here, one level down, while a 2D grid
  of cards sat at /arcade/. There is one door now and this is not it — the sky
  IS the arcade. This page exists only so that a link someone already has, or
  an installed shortcut pointing at the old path, still arrives somewhere.

  A meta refresh rather than a script, so it works with JavaScript off, and a
  canonical link beside it because the arcade's own registry follows exactly
  those two hints when it resolves a game's real home (see js/registry.js).
  Nothing here needs to be pretty; nobody should see it for more than a blink.
-->
<meta http-equiv="refresh" content="0; url=../">
<link rel="canonical" href="../">
<meta name="robots" content="noindex">
<title>GOPHER CLOUD ARCADE — moved up a level</title>
<style>
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #050810;
    color: #cfe0ef;
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  a { color: #f9c66b; }
</style>
</head>
<body>
  <p>The arcade is up a level now.<br><a href="../">Take me to the sky</a></p>
</body>
</html>
